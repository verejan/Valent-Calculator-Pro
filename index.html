<!DOCTYPE html>
<html lang="ro">

    <title>Valent.md - Motor Calcul Prețuri</title>

        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .active-region { 
            background: linear-gradient(135deg, #10b981 0%, #059669 100%) !important; 
            color: white !important; 
            box-shadow: 0 10px 15px -3px rgba(16, 185, 129, 0.3), 0 0 0 2px rgba(16, 185, 129, 0.1) !important;
            transform: translateX(2px);
        }
        
        /* Stiluri pentru export PDF */
        .pdf-mode .no-pdf { display: none !important; }
        .pdf-mode { padding: 40px !important; width: 210mm !important; margin: 0 auto !important; }
        .hide-prices .price-col { display: none !important; }

        @media (max-width: 1024px) {
            .main-layout { flex-direction: column; height: auto; overflow-y: auto; }
            .side-panel { width: 100% !important; height: auto !important; border-right: none; border-bottom: 1px solid #e2e8f0; }
            .preview-area { padding: 1rem !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 lg:h-screen lg:overflow-hidden">

<div id="app" class="flex flex-col lg:flex-row h-full main-layout">
    <!-- NAVIGARE LATERALĂ -->
    <nav class="w-full lg:w-72 bg-slate-900 border-r border-slate-800 flex flex-col shrink-0 side-panel">

                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
                </div>
                <span class="text-white font-extrabold text-xl tracking-tighter italic uppercase leading-none">VALENT.MD</span>
            </div>
            <p class="text-[9px] text-emerald-400 font-bold uppercase tracking-widest italic">Rețea Globală de Montaj</p>
        </div>
        
        <div class="flex-1 overflow-y-auto p-4 space-y-1 no-scrollbar lg:max-h-none max-h-48" id="region-list">
            <!-- Injectat din JS -->
        </div>

        <div class="p-4 bg-slate-950 border-t border-slate-800 grid grid-cols-2 gap-2">
            <button onclick="setInstallType('renovare')" id="btn-renovare" class="w-full py-2 text-[10px] font-black rounded-lg border transition-all uppercase">RENOVARE</button>
            <button onclick="setInstallType('nou')" id="btn-nou" class="w-full py-2 text-[10px] font-black rounded-lg border transition-all uppercase">NOU</button>
        </div>
    </nav>

    <!-- PANOU CONFIGURARE -->
    <aside class="w-full lg:w-80 bg-white border-r border-slate-200 flex flex-col shadow-xl z-10 side-panel">
        <div class="p-4 lg:p-6 border-b border-slate-100 bg-slate-50/50">
            <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4">Informații Beneficiar</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-3">
                <input oninput="updateClientInfo('name', this.value)" class="w-full h-10 bg-white border border-slate-200 rounded-xl px-4 text-xs font-bold focus:border-emerald-500 outline-none" placeholder="Nume Beneficiar">
                <input oninput="updateClientInfo('phone', this.value)" id="client-phone-input" class="w-full h-10 bg-white border border-slate-200 rounded-xl px-4 text-xs font-bold focus:border-emerald-500 outline-none" placeholder="Telefon">
            </div>
        </div>

            <!-- Dinamica produselor -->
        </div>

        <div class="p-4 lg:p-6 bg-slate-50 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2">
            <button onclick="generatePDF('tech')" class="w-full bg-slate-800 text-white py-3 rounded-xl text-[10px] font-black uppercase hover:bg-slate-700 transition-all flex items-center justify-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                PDF Tehnic
            </button>
            <button onclick="generatePDF('client')" class="w-full bg-emerald-500 text-white py-3 rounded-xl text-[10px] font-black uppercase hover:bg-emerald-600 transition-all flex items-center justify-center gap-2">

                PDF Client

    </aside>

    <!-- PREVIZUALIZARE DOCUMENT -->

                    </div>
                    <div class="text-left sm:text-right">
                        <div id="view-region-badge" class="px-3 py-1 bg-emerald-500 text-white rounded-full text-[10px] font-black inline-block uppercase tracking-wide">---</div>

                    </div>

                                <th class="pb-4 text-right text-[10px] font-black text-slate-400 uppercase w-24 price-col tracking-widest">Subtotal</th>
                            </tr>
                        </thead>

                    </table>
                </div>

            </div>

                    <div class="text-center sm:text-right w-full sm:w-auto">

                            <span class="text-xl font-black text-slate-900 mb-1.5">€</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>

    // ============================================
    const regionsByCountry = {
        "🇮🇪 Irlanda": ["ie_simplu", "ie_cheie", "ie_finish"],
        "🇮🇹 Italia": ["faenza", "ferrara", "grosseto_cash", "grosseto_factura", "padova", "torino", "bologna", "milano", "genova", "roma"],
        "🇫🇷 Franța": ["paris"],
        "🇩🇪 Germania": ["kassel", "koln"],
        "🇦🇹 Austria": ["viena"]
    };

    // ============================================
    // STAREA APLICAȚIEI
    // ============================================
    let state = { 
        region: 'ie_simplu', 
        type: 'renovare', 
        quantities: {}, 
        dist: 0, 
        tax: false, 
        client: { name: 'Beneficiar', phone: '+353' },
        expandedCountries: {} // Track which countries are expanded
    };

    // ============================================
    // FUNCȚII PRINCIPALE
    // ============================================
    function init() {
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('ro-RO', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
        });
        renderRegions();
        renderConfig();
        updateUI();
    }

    function renderRegions() {
        const container = document.getElementById('region-list');
        container.innerHTML = '<h3 class="px-3 py-2 text-[10px] font-black text-slate-500 uppercase tracking-widest mb-2 lg:block hidden">Regiuni Disponibile</h3>';
        
        // Initialize expanded countries if not set
        if (Object.keys(state.expandedCountries).length === 0) {
            Object.keys(regionsByCountry).forEach(country => {
                // Auto-expand the country that contains the current region
                const hasActiveRegion = regionsByCountry[country].includes(state.region);
                state.expandedCountries[country] = hasActiveRegion;
            });
        }
        
        Object.entries(regionsByCountry).forEach(([countryName, regionIds]) => {
            const isExpanded = state.expandedCountries[countryName];
            const hasActiveRegion = regionIds.includes(state.region);
            
            // Country header button
            const countryBtn = document.createElement('button');
            countryBtn.className = `w-full text-left px-4 py-3 rounded-xl transition-all flex items-center justify-between mb-1 ${hasActiveRegion ? 'bg-slate-800 text-white' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200'}`;
            countryBtn.innerHTML = `
                <div class="flex items-center">
                    <span class="text-base mr-2">${countryName.split(' ')[0]}</span>
                    <span class="text-xs font-bold">${countryName.split(' ').slice(1).join(' ')}</span>
                    <span class="ml-2 text-[9px] bg-slate-700 px-2 py-0.5 rounded-full">${regionIds.length}</span>
                </div>
                <svg class="w-4 h-4 transition-transform ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                </svg>
            `;
            countryBtn.onclick = () => {
                state.expandedCountries[countryName] = !state.expandedCountries[countryName];
                renderRegions();
            };
            container.appendChild(countryBtn);
            
            // Regions list (collapsible)
            if (isExpanded) {
                const regionsContainer = document.createElement('div');
                regionsContainer.className = 'ml-2 mb-2 space-y-1';
                
                regionIds.forEach(regionId => {
                    const r = pricingData[regionId];
                    const isActive = state.region === regionId;
                    
                    const regionBtn = document.createElement('button');
                    regionBtn.className = `w-full text-left px-4 py-2.5 rounded-lg transition-all flex items-center justify-between group ${isActive ? 'active-region' : 'text-slate-400 hover:bg-slate-800 hover:text-slate-200 bg-slate-900/30'}`;
                    regionBtn.innerHTML = `
                        <div class="flex items-center">
                            <span class="mr-2 text-sm">${r.flag}</span>
                            <span class="text-[11px] font-bold">${r.name}</span>
                        </div>
                    `;
                    regionBtn.onclick = () => { 
                        state.region = regionId; 
                        state.quantities = {}; 
                        state.dist = 0; 
                        state.client.phone = r.prefix;
                        document.getElementById('client-phone-input').value = r.prefix;
                        renderRegions(); 
                        renderConfig(); 
                        updateUI(); 
                    };
                    regionsContainer.appendChild(regionBtn);
                });
                
                container.appendChild(regionsContainer);
            }
        });
    }

    function renderConfig() {
        const data = pricingData[state.region];
        const container = document.getElementById('items-container');
        let html = `<div class="mb-8"><h3 class="text-[10px] font-black text-slate-400 uppercase mb-4 tracking-widest">Distanță / Zonă</h3>`;
        
        if(data.type === 'per_km') {
            html += `<div class="relative"><input type="number" oninput="state.dist=this.value;updateUI()" class="w-full h-11 bg-slate-100 rounded-xl px-4 text-xs font-black outline-none border-2 border-transparent focus:border-emerald-500" placeholder="0"><span class="absolute right-4 top-1/2 -translate-y-1/2 text-[10px] font-black text-slate-400">KM</span></div>`;
        } else {
            html += `<select onchange="state.dist=this.value;updateUI()" class="w-full h-11 bg-slate-100 rounded-xl px-4 text-xs font-black outline-none border-2 border-transparent focus:border-emerald-500 appearance-none">`;
            data.zones.forEach((z, i) => html += `<option value="${i}">${z.l} (+${z.p}€)</option>`);
            html += `</select>`;
        }
        html += `</div><div class="space-y-6">`;
        
        data.cats.forEach(cat => {
            html += `<div><h4 class="text-[10px] font-black text-emerald-600 mb-3 uppercase tracking-wider">${cat.t}</h4><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-1 gap-2">`;
            cat.items.forEach(item => {
                const val = state.quantities[item.id] || "";
                const price = state.type === 'renovare' ? (item.pr ?? item.p) : (item.pn ?? item.p);
                html += `
                <div class="flex items-center gap-3 p-3 rounded-2xl hover:bg-slate-50 border border-transparent hover:border-slate-100 transition-all bg-white lg:bg-transparent shadow-sm lg:shadow-none">
                    <div class="flex-1">
                        <p class="text-[11px] font-bold text-slate-700 leading-tight">${item.n}</p>
                        <p class="text-[9px] font-black text-emerald-500 mt-1 uppercase">${price}€ / buc</p>
                    </div>
                    <input type="number" value="${val}" oninput="state.quantities['${item.id}']=this.value;updateUI()" class="w-14 h-10 bg-slate-100 border-2 border-transparent rounded-xl text-center text-xs font-black outline-none focus:border-emerald-500 focus:bg-white transition-colors" placeholder="0">
                </div>`;
            });
            html += `</div></div>`;
        });
        container.innerHTML = html;
    }

    function updateUI() {
        const data = pricingData[state.region];
        
        // Actualizare butoane tip instalație
        document.getElementById('btn-renovare').className = `w-full py-2 text-[10px] font-black rounded-lg border-2 transition-all ${state.type === 'renovare' ? 'bg-white text-slate-900 border-white shadow-md' : 'text-slate-500 border-slate-800 lg:border-slate-800'}`;
        document.getElementById('btn-nou').className = `w-full py-2 text-[10px] font-black rounded-lg border-2 transition-all ${state.type === 'nou' ? 'bg-white text-slate-900 border-white shadow-md' : 'text-slate-500 border-slate-800 lg:border-slate-800'}`;
        
        // Actualizare info regiune
        document.getElementById('view-region-badge').innerText = data.name.toUpperCase();
        document.getElementById('view-region-note').innerText = data.note || "Ofertă Profesională de Montaj";
        document.getElementById('view-type-label').innerText = state.type === 'renovare' ? 'Renovare' : 'Casă Nouă';
        
        // Calcul total și generare tabel
        let subtotal = 0;
        let itemsHtml = '';
        
        data.cats.forEach(cat => {
            cat.items.forEach(item => {
                const qty = parseFloat(state.quantities[item.id]) || 0;
                if(qty > 0) {
                    const price = state.type === 'renovare' ? (item.pr ?? item.p) : (item.pn ?? item.p);
                    const lineTotal = qty * price;
                    subtotal += lineTotal;
                    itemsHtml += `<tr><td class="py-4"><p class="text-[11px] font-bold text-slate-800">${item.n}</p></td><td class="py-4 text-center text-xs font-black text-slate-500">${qty}</td><td class="py-4 text-right text-xs font-black text-slate-900 price-col">${lineTotal.toLocaleString()}€</td></tr>`;
                }
            });
        });

        // Calcul transport
        const transport = data.type === 'per_km' ? (state.dist * data.rate) : (data.zones[state.dist]?.p || 0);
        if(transport > 0) {
            itemsHtml += `<tr class="bg-slate-50/50"><td class="py-3 px-2 italic text-[10px] font-bold text-slate-500 tracking-wider uppercase">Transport (${data.type === 'per_km' ? state.dist + ' km' : 'Zonă'})</td><td class="py-3 text-center text-xs font-black">1</td><td class="py-3 px-2 text-right text-xs font-black text-slate-900 price-col">${transport.toFixed(0)}€</td></tr>`;
        }

        document.getElementById('invoice-items').innerHTML = itemsHtml || '<tr><td colspan="3" class="py-16 text-center text-slate-300 text-xs font-black uppercase tracking-widest">Selectați servicii din meniul stâng</td></tr>';
        
        // Total final
        const totalFinal = state.tax ? ((subtotal + transport) * data.tax) : (subtotal + transport);
        document.getElementById('total-amount').innerText = Math.round(totalFinal).toLocaleString();
        
        // Buton taxă - ascunde pentru regiuni cu hideTaxButton: true
        const taxBtn = document.getElementById('tax-btn');
        if (data.hideTaxButton) {
            taxBtn.style.display = 'none';
            state.tax = false; // Forțăm taxa să fie false pentru aceste regiuni
        } else {
            taxBtn.style.display = 'block';
            taxBtn.innerText = state.tax ? `Include Taxă (${Math.round(data.tax*100-100)}%)` : `Preț Cash (0% Tax)`;
            taxBtn.className = `no-pdf px-4 py-2 rounded-xl text-[10px] font-black uppercase border-2 transition-all ${state.tax ? 'bg-emerald-500 text-white border-emerald-500 shadow-lg' : 'bg-white text-slate-400 border-slate-200'}`;
        }
        
        // Info client
        document.getElementById('view-client-name').innerText = state.client.name || 'Beneficiar';
        document.getElementById('view-client-phone').innerText = state.client.phone || '---';
        document.getElementById('extra-notes').innerText = data.note ? `* Notă: ${data.note}` : "";
    }

    function generatePDF(mode) {
        const element = document.getElementById('invoice-doc');
        element.classList.add('pdf-mode');
        if (mode === 'client') element.classList.add('hide-prices');

        const opt = {
            margin: [0, 0],
            filename: `Oferta_Valent.md_${state.client.name.replace(/\s+/g, '_')}_${mode}.pdf`,
            image: { type: 'jpeg', quality: 1 },
            html2canvas: { scale: 2, useCORS: true, letterRendering: true },
            jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };

        html2pdf().set(opt).from(element).save().then(() => {
            element.classList.remove('pdf-mode');
            element.classList.remove('hide-prices');
        });
    }

    function setInstallType(t) { 
        state.type = t; 
        renderConfig(); 
        updateUI(); 
    }

    function toggleTax() { 
        state.tax = !state.tax; 
        updateUI(); 
    }

    function updateClientInfo(k, v) { 
        state.client[k] = v; 
        updateUI(); 
    }

    // ============================================
    // INIȚIALIZARE
    // ============================================
    window.onload = init;
</script>
</body>
</html>
